[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anmedsos-prep"
version = "1.0.0"
description = "Pipeline pengumpulan & preprocessing data X + YouTube: kasus keracunan MBG (Sukoharjo vs Karo)"
requires-python = ">=3.10"
dependencies = ["pandas>=3.0", "numpy>=2.0", "PyYAML>=6.0", "Sastrawi>=1.0.1", "pyarrow>=15", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbstripout>=0.7", "nbformat>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
